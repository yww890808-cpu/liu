# 一键启动：docker compose up -d --build
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://ozon:ozon@postgres:5432/ozon
    REDIS_URL: redis://redis:6379/0
    LABEL_DIR: /srv/data/labels
  volumes:
    - ./data/labels:/srv/data/labels
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: ozon
      POSTGRES_DB: ozon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # 启动前自动执行数据库迁移
  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  # 并发数 2：限流按进程计算，单店铺实际频率最多为 OZON_RATE_LIMIT_PER_SEC × 2
  worker:
    <<: *app
    command: celery -A app.tasks.celery_app worker -l info --concurrency=2

  beat:
    <<: *app
    command: celery -A app.tasks.celery_app beat -l info

  # 每天自动备份数据库到 ./backups，保留 BACKUP_KEEP_DAYS 天（默认 14 天）
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ozon
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/ozon-$$(date +%Y%m%d-%H%M%S).sql.gz
          if pg_dump -h postgres -U ozon ozon | gzip > $$f.tmp; then
            mv $$f.tmp $$f && echo "备份完成 $$f"
          else
            rm -f $$f.tmp && echo "备份失败" >&2
          fi
          find /backups -name 'ozon-*.sql.gz' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
    restart: unless-stopped

volumes:
  pgdata:
